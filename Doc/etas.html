// 7. RENDERIZAÇÃO DAS CAMADAS NO MAPA
let polygonRefs = [];
function drawMapElements(filterSystems = null) {
    layers.polygons.clearLayers();
    layers.lines.clearLayers();
    layers.dams.clearLayers();
    layers.etas.clearLayers();
    polygonRefs = [];
    const currentOpacity = document.getElementById('opVal').innerText.replace('%','') / 100;
    // Polígonos com 50% de transparência
    sistemas.forEach(s => {
        if (filterSystems && !filterSystems.includes(s.id)) return;
        const poly = L.polygon(s.poligono, {
            color: s.cor,
            weight: 2,
            fillColor: s.cor,
            fillOpacity: currentOpacity
        }).addTo(layers.polygons);
        poly.bindPopup(`
<div class="popup-title">${s.nome}</div>
<div class="popup-line"><b>Capacidade / Manancial:</b> ${s.cap}</div>
<div class="popup-line"><b>Cidades Atendidas:</b> ${s.cidades.join(', ')}</div>
        `);
        polygonRefs.push(poly);
    });
    // Linhas de Adução
    adutoras.forEach(a => {
        L.polyline(a.coords, {
            color: a.cor, weight: 3, dashArray: '6, 8', opacity: 0.9
        }).addTo(layers.lines).bindPopup(`<div class="popup-title">Adutora / Túnel</div><div class="popup-line">${a.nome}</div>`);
    });
    // Barragens
    barragens.forEach(b => {
        if (filterSystems && !filterSystems.includes(b.sistema)) return;
        const icon = L.divIcon({
            className: '',
            html: `<div class="dam-marker" style="background:${b.cor}">🌊</div>`,
            iconSize: [22, 22], iconAnchor: [11, 11]
        });
        L.marker(b.coords, { icon }).addTo(layers.dams).bindPopup(`
<div class="popup-title">🌊 ${b.nome}</div>
<div class="popup-line"><b>Município:</b> ${b.cidade}</div>
<div class="popup-line"><b>Detalhes:</b> ${b.info}</div>
<div class="popup-line"><b>Coordenadas:</b> ${b.coords[0].toFixed(4)}, ${b.coords[1].toFixed(4)}</div>
<button class="popup-btn" onclick="map.flyTo([${b.coords[0]}, ${b.coords[1]}], 17)">🔍 Zoom Satélite na Crista da Barragem</button>
        `);
    });
    // ETAs (Ícones Hexagonais/Diamante em Destaque)
    etas.forEach(e => {
        if (filterSystems && !filterSystems.includes(e.sistema)) return;
        const icon = L.divIcon({
            className: '',
            html: `<div class="eta-marker" style="background:${e.cor}"><span>⚙️</span></div>`,
            iconSize: [28, 28], iconAnchor: [14, 14]
        });
        L.marker(e.coords, { icon }).addTo(layers.etas).bindPopup(`
<div class="popup-title">⚙️ ${e.nome}</div>
<div class="popup-line"><b>Vazão / Porte:</b> ${e.vazao}</div>
<div class="popup-line"><b>Localização Exata:</b> ${e.endereco}</div>
<div class="popup-line"><b>Municípios que Abastece:</b> ${e.atende}</div>
<div class="popup-line"><b>Coordenadas Auditadas:</b> ${e.coords[0].toFixed(4)}, ${e.coords[1].toFixed(4)}</div>
<button class="popup-btn" onclick="map.flyTo([${e.coords[0]}, ${e.coords[1]}], 18)">🛰️ Inspecionar Tanques da ETA no Satélite (Zoom 18)</button>
        `);
    });
}
// 8. INTERFACE LATERAL E BUSCA
let currentTab = 'etas';
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    drawMapElements(null);
    renderList();
}
function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('listContainer');
    container.innerHTML = '';
    if (currentTab === 'etas') {
        etas.filter(e => (e.nome + e.municipio + e.atende).toLowerCase().includes(q)).forEach(e => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => {
                drawMapElements(null);
                map.flyTo(e.coords, 18, { duration: 1.4 });
            };
            div.innerHTML = `
<div class="card-header">
<div class="card-title"><span style="color:${e.cor}">⚙️</span> ${e.nome}</div>
<span class="badge" style="background:${e.cor}33; color:${e.cor}; border:1px solid ${e.cor}">${e.vazao}</span>
</div>
<div class="card-meta"><b>📍 Endereço:</b> ${e.endereco}</div>
<div class="card-meta"><b>🏙️ Abastece:</b> ${e.atende}</div>
<span class="coord-tag">🎯 Satélite Auditado: ${e.coords[0].toFixed(4)}, ${e.coords[1].toFixed(4)} (Clique para Zoom 18)</span>
            `;
            container.appendChild(div);
        });
    } else if (currentTab === 'barragens') {
        barragens.filter(b => (b.nome + b.cidade + b.info).toLowerCase().includes(q)).forEach(b => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => {
                drawMapElements(null);
                map.flyTo(b.coords, 16, { duration: 1.4 });
            };
            div.innerHTML = `
<div class="card-header">
<div class="card-title"><span style="color:${b.cor}">🌊</span> ${b.nome}</div>
<span class="badge" style="background:${b.cor}33; color:${b.cor}">${b.cidade}</span>
</div>
<div class="card-meta">${b.info}</div>
<span class="coord-tag">🎯 Coord: ${b.coords[0].toFixed(4)}, ${b.coords[1].toFixed(4)}</span>
            `;
            container.appendChild(div);
        });
    } else if (currentTab === 'sistemas') {
        sistemas.filter(s => (s.nome + s.regiao + s.cidades.join(' ')).toLowerCase().includes(q)).forEach(s => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => {
                drawMapElements([s.id]);
                const bounds = L.polygon(s.poligono).getBounds();
                map.flyToBounds(bounds, { padding: [50, 50], duration: 1.2 });
            };
            div.innerHTML = `
<div class="card-header">
<div class="card-title"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${s.cor}"></span> ${s.nome}</div>
<span class="badge" style="background:${s.cor}33; color:${s.cor}">${s.regiao}</span>
</div>
<div class="card-meta"><b>Capacidade:</b> ${s.cap}</div>
<div class="card-meta"><b>Cidades:</b> ${s.cidades.join(', ')}</div>
            `;
            container.appendChild(div);
        });
    } else if (currentTab === 'cidades') {
        cidadesDB.filter(c => (c.nome + c.desc).toLowerCase().includes(q)).forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => {
                drawMapElements(c.sistemas);
                map.flyTo(c.coords, 11, { duration: 1.2 });
            };
            div.innerHTML = `
<div class="card-header">
<div class="card-title">🏙️ ${c.nome}</div>
<span class="badge" style="background:rgba(56,189,248,0.2); color:#38bdf8">${c.sistemas.length} Sistema(s)</span>
</div>
<div class="card-meta">${c.desc}</div>
<span class="coord-tag">🔍 Clique para isolar as ETAs, represas e manchas que abastecem esta cidade</span>
            `;
            container.appendChild(div);
        });
    }
}
function updatePolygonOpacity(val) {
    document.getElementById('opVal').innerText = val + '%';
    polygonRefs.forEach(p => p.setStyle({ fillOpacity: val / 100 }));
}
function toggleLayerGroup(groupName, show) {
    if (show) map.addLayer(layers[groupName]);
    else map.removeLayer(layers[groupName]);
}
function flyRegion(coords, zoom) {
    drawMapElements(null);
    map.flyTo(coords, zoom, { duration: 1.2 });
}
// Inicializar tudo
drawMapElements(null);
renderList();
</script>
</body>
